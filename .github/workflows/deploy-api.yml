name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet publish src/Mka.Api -c Release -o publish/api
      - run: dotnet publish src/Mka.Functions -c Release -o publish/functions
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api
      - uses: actions/upload-artifact@v4
        with:
          name: functions
          path: publish/functions
          include-hidden-files: true

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish/api
      - uses: actions/download-artifact@v4
        with:
          name: functions
          path: publish/functions
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: mka-api-bahman
          package: publish/api
      - uses: azure/functions-action@v1
        with:
          app-name: func-mka-bahman
          package: publish/functions